name: Terraform Manual Destroy

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: Cluster name to destroy
        required: true
        type: string
      confirm_destroy:
        description: Type DESTROY to confirm cluster teardown
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-manual-destroy-${{ inputs.cluster_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'els-k8s-infra/terraform.tfstate' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_VAR_cluster_name: ${{ inputs.cluster_name }}

jobs:
  verify_target:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "You must type DESTROY exactly in confirm_destroy to run this workflow." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Verify state target
        shell: bash
        run: |
          state_cluster=$(terraform output -raw eks_cluster_name 2>/dev/null || true)

          {
            echo "### Terraform manual destroy"
            echo
            echo "Requested cluster: ${{ inputs.cluster_name }}"
            echo "State key: ${{ vars.TF_STATE_KEY }}"
            if [[ -n "$state_cluster" ]]; then
              echo "Cluster recorded in state: $state_cluster"
            else
              echo "Cluster recorded in state: not available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$state_cluster" && "$state_cluster" != "${{ inputs.cluster_name }}" ]]; then
            echo "Requested cluster name does not match the cluster currently stored in Terraform state." >&2
            exit 1
          fi

  remove_addon_live_manifests:
    needs: verify_target
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set staged destroy variables for addon live manifests
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=true" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=true" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=true" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Configure kubectl for cleanup
        shell: bash
        run: |
          if aws eks describe-cluster --name "${{ inputs.cluster_name }}" --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${{ vars.AWS_REGION }}"
          else
            echo "Cluster ${{ inputs.cluster_name }} is not available through EKS yet. Skipping kubectl cleanup configuration."
          fi

      - name: Delete Argo CD-managed applications
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping Argo CD cleanup."
            exit 0
          fi

          if ! kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
            echo "Argo CD Application CRD not found. Skipping Argo CD cleanup."
            exit 0
          fi

          # Let Argo CD cascade-delete each app's live resources (Deployments, PVCs, ...)
          # while its controller is still running, instead of leaving that to cluster teardown.
          kubectl delete applications.argoproj.io --all -n argocd --ignore-not-found=true \
            --timeout=180s --wait=true || true

          # Anything still stuck (e.g. controller already unresponsive) shouldn't block
          # Terraform from removing the root Application object next.
          for resource in applications.argoproj.io appprojects.argoproj.io; do
            kubectl get "$resource" -n argocd -o name 2>/dev/null | while read -r item; do
              [[ -n "$item" ]] || continue
              kubectl patch "$item" -n argocd --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done

      - name: Delete Karpenter-provisioned nodes
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping Karpenter cleanup."
            exit 0
          fi

          if ! kubectl get crd nodeclaims.karpenter.sh >/dev/null 2>&1; then
            echo "Karpenter NodeClaim CRD not found. Skipping Karpenter cleanup."
            exit 0
          fi

          # Let Karpenter terminate its EC2 instances properly while the controller is
          # still running. Removing finalizers first would orphan the underlying instances.
          kubectl delete nodeclaims.karpenter.sh --all --ignore-not-found=true --timeout=300s \
            --wait=true || true

          # Anything still stuck shouldn't block Terraform from removing the
          # NodePool/EC2NodeClass objects next.
          for resource in ec2nodeclasses.karpenter.k8s.aws nodepools.karpenter.sh nodeclaims.karpenter.sh; do
            kubectl get "$resource" -o name 2>/dev/null | while read -r item; do
              [[ -n "$item" ]] || continue
              kubectl patch "$item" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done

      - name: Safety net - terminate orphaned Karpenter EC2 instances
        shell: bash
        continue-on-error: true
        run: |
          instance_ids=$(aws ec2 describe-instances \
            --filters "Name=tag:karpenter.sh/cluster,Values=${{ inputs.cluster_name }}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text --region "${{ env.AWS_REGION }}")

          if [[ -n "$instance_ids" ]]; then
            echo "Terminating orphaned Karpenter-managed instances: $instance_ids"
            aws ec2 terminate-instances --instance-ids $instance_ids --region "${{ env.AWS_REGION }}" || true
            aws ec2 wait instance-terminated --instance-ids $instance_ids --region "${{ env.AWS_REGION }}" || true
          else
            echo "No leftover Karpenter-managed EC2 instances found."
          fi

      - name: Delete leftover PersistentVolumeClaims
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping PVC cleanup."
            exit 0
          fi

          # Delete PVCs while the EBS CSI driver is still running so it can clean up the
          # backing EBS volumes, instead of leaving them orphaned after cluster teardown.
          kubectl delete pvc --all --all-namespaces --ignore-not-found=true --timeout=180s \
            --wait=true || true
      
      - name: Remove stale Karpenter manifest state entries
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping state reconciliation."
            exit 0
          fi

          # kubernetes_manifest resources need their CRD present in the cluster just to
          # plan a destroy. If a previous incomplete build never installed the CRD, drop
          # the stale state entry so Terraform doesn't try to refresh a type that isn't
          # registered, instead of hard-failing the plan.
          declare -A manifest_crds=(
            ["kubernetes_manifest.karpenter_node_class[0]"]="ec2nodeclasses.karpenter.k8s.aws"
            ["kubernetes_manifest.karpenter_node_pool[0]"]="nodepools.karpenter.sh"
          )

          for address in "${!manifest_crds[@]}"; do
            crd="${manifest_crds[$address]}"
            if terraform state list 2>/dev/null | grep -qx "$address"; then
              if ! kubectl get crd "$crd" >/dev/null 2>&1; then
                echo "CRD $crd not installed; removing stale $address from state."
                terraform state rm "$address" || true
              fi
            fi
          done

      - name: Terraform plan
        shell: bash
        run: |
          # tf_plan_args=(
          #   -target=kubernetes_manifest.karpenter_node_class
          #   -target=kubernetes_manifest.karpenter_node_pool
          # )

          terraform plan -destroy -lock-timeout=10m -no-color "${tf_plan_args[@]}" -out=tfplan

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

  remove_addons:
    needs: remove_addon_live_manifests
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set staged destroy variables for addons
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_observability=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_argocd=false" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: terraform plan -lock-timeout=10m -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

  destroy_base:
    needs: remove_addons
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set base destroy variables
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_observability=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_argocd=false" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan destroy
        run: terraform plan -destroy -lock-timeout=10m -no-color -out=tfdestroy

      - name: AWS CLI cleanup of leftover VPC networking resources
        if: ${{ always() }}
        shell: bash
        continue-on-error: true
        run: |
          # Run this regardless of terraform destroy's outcome: the VPC itself can be
          # reported as destroyed while orphaned subnets/IGWs/EIPs are left behind, so
          # look these up by their own tags rather than requiring the VPC to still exist.
          vpc_id=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ inputs.cluster_name }}-vpc" \
            --query "Vpcs[0].VpcId" --output text --region "${{ env.AWS_REGION }}")
          [[ "$vpc_id" == "None" ]] && vpc_id=""

          if [[ -n "$vpc_id" ]]; then
            echo "Found VPC $vpc_id still present for ${{ inputs.cluster_name }}."
          else
            echo "No VPC found for ${{ inputs.cluster_name }}. Checking for orphaned resources by tag."
          fi

          # Remove any Transit Gateway attachments first, since the IGW/subnets can't
          # be deleted while still attached to a transit gateway. Only discoverable
          # while the VPC still exists, since attachments are looked up by vpc-id.
          if [[ -n "$vpc_id" ]]; then
            tgw_attachment_ids=$(aws ec2 describe-transit-gateway-vpc-attachments \
              --filters "Name=vpc-id,Values=$vpc_id" "Name=state,Values=available,pending,modifying" \
              --query "TransitGatewayVpcAttachments[].TransitGatewayAttachmentId" \
              --output text --region "${{ env.AWS_REGION }}")
            for attachment_id in $tgw_attachment_ids; do
              echo "Deleting Transit Gateway attachment $attachment_id"
              aws ec2 delete-transit-gateway-vpc-attachment --transit-gateway-attachment-id \
                "$attachment_id" --region "${{ env.AWS_REGION }}" || true
            done
          fi

          # Internet Gateways tagged for this cluster, whether or not the VPC still exists.
          igw_ids=$(aws ec2 describe-internet-gateways \
            --filters "Name=tag:Cluster,Values=${{ inputs.cluster_name }}" \
            --query "InternetGateways[].InternetGatewayId" --output text --region "${{ env.AWS_REGION }}")
          for igw_id in $igw_ids; do
            attached_vpc=$(aws ec2 describe-internet-gateways --internet-gateway-ids "$igw_id" \
              --query "InternetGateways[0].Attachments[0].VpcId" --output text --region "${{ env.AWS_REGION }}")
            if [[ -n "$attached_vpc" && "$attached_vpc" != "None" ]]; then
              echo "Detaching Internet Gateway $igw_id from $attached_vpc"
              aws ec2 detach-internet-gateway --internet-gateway-id "$igw_id" --vpc-id "$attached_vpc" \
                --region "${{ env.AWS_REGION }}" || true
            fi
            echo "Deleting Internet Gateway $igw_id"
            aws ec2 delete-internet-gateway --internet-gateway-id "$igw_id" --region "${{ env.AWS_REGION }}" || true
          done

          # Subnets tagged for this cluster, whether or not the VPC still exists.
          subnet_ids=$(aws ec2 describe-subnets \
            --filters "Name=tag:kubernetes.io/cluster/${{ inputs.cluster_name }},Values=shared" \
            --query "Subnets[].SubnetId" --output text --region "${{ env.AWS_REGION }}")
          for subnet_id in $subnet_ids; do
            echo "Deleting subnet $subnet_id"
            aws ec2 delete-subnet --subnet-id "$subnet_id" --region "${{ env.AWS_REGION }}" || true
          done

          # Release leftover Elastic IPs tagged for this cluster
          eip_alloc_ids=$(aws ec2 describe-addresses \
            --filters "Name=tag:Cluster,Values=${{ inputs.cluster_name }}" \
            --query "Addresses[].AllocationId" --output text --region "${{ env.AWS_REGION }}")
          for alloc_id in $eip_alloc_ids; do
            echo "Releasing Elastic IP allocation $alloc_id"
            aws ec2 release-address --allocation-id "$alloc_id" --region "${{ env.AWS_REGION }}" || true
          done

      - name: Residual cleanup guidance on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "### Manual cleanup follow-up"
            echo
            echo "Terraform destroy did not fully complete. An automated pass already attempted to remove leftover subnets, internet gateways, elastic IPs, and transit gateway attachments tagged for this cluster. If AWS still has dependent resources, clean them up in this order before rerunning the workflow:"
            echo
            echo "- terminate and delete any leftover EC2 instances"
            echo "- delete leftover network interfaces"
            echo "- delete subnets"
            echo "- detach and delete internet gateways"
            echo "- delete security groups that are no longer in use"
            echo "- check for and delete any leftover EBS volumes tagged for this cluster"
            echo "- release any leftover elastic IPs"
            echo "- remove any leftover transit gateway attachments"
            echo "- remove any other dependent resources still blocking VPC deletion"
            echo
            echo "After that cleanup, rerun the manual destroy workflow for cluster ${{ inputs.cluster_name }}."
          } >> "$GITHUB_STEP_SUMMARY"
