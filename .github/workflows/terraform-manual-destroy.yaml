name: Terraform Manual Destroy

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: Cluster name to destroy
        required: true
        type: string
      confirm_destroy:
        description: Type DESTROY to confirm cluster teardown
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-manual-destroy-${{ inputs.cluster_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'els-k8s-infra/terraform.tfstate' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_VAR_cluster_name: ${{ inputs.cluster_name }}

jobs:
  verify_target:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "You must type DESTROY exactly in confirm_destroy to run this workflow." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Verify state target
        shell: bash
        run: |
          state_cluster=$(terraform output -raw eks_cluster_name 2>/dev/null || true)

          {
            echo "### Terraform manual destroy"
            echo
            echo "Requested cluster: ${{ inputs.cluster_name }}"
            echo "State key: ${{ vars.TF_STATE_KEY }}"
            if [[ -n "$state_cluster" ]]; then
              echo "Cluster recorded in state: $state_cluster"
            else
              echo "Cluster recorded in state: not available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$state_cluster" && "$state_cluster" != "${{ inputs.cluster_name }}" ]]; then
            echo "Requested cluster name does not match the cluster currently stored in Terraform state." >&2
            exit 1
          fi

  remove_addon_live_manifests:
    needs: verify_target
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set staged destroy variables for addon live manifests
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=true" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=true" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=true" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Configure kubectl for cleanup
        shell: bash
        run: |
          if aws eks describe-cluster --name "${{ inputs.cluster_name }}" --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${{ vars.AWS_REGION }}"
          else
            echo "Cluster ${{ inputs.cluster_name }} is not available through EKS yet. Skipping kubectl cleanup configuration."
          fi

      - name: Delete Argo CD-managed applications
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping Argo CD cleanup."
            exit 0
          fi

          if ! kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
            echo "Argo CD Application CRD not found. Skipping Argo CD cleanup."
            exit 0
          fi

          # Let Argo CD cascade-delete each app's live resources (Deployments, PVCs, ...)
          # while its controller is still running, instead of leaving that to cluster teardown.
          kubectl delete applications.argoproj.io --all -n argocd --ignore-not-found=true \
            --timeout=180s --wait=true || true

          # Anything still stuck (e.g. controller already unresponsive) shouldn't block
          # Terraform from removing the root Application object next.
          for resource in applications.argoproj.io appprojects.argoproj.io; do
            kubectl get "$resource" -n argocd -o name 2>/dev/null | while read -r item; do
              [[ -n "$item" ]] || continue
              kubectl patch "$item" -n argocd --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done

      - name: Delete Karpenter-provisioned nodes
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping Karpenter cleanup."
            exit 0
          fi

          if ! kubectl get crd nodeclaims.karpenter.sh >/dev/null 2>&1; then
            echo "Karpenter NodeClaim CRD not found. Skipping Karpenter cleanup."
            exit 0
          fi

          # Let Karpenter terminate its EC2 instances properly while the controller is
          # still running. Removing finalizers first would orphan the underlying instances.
          kubectl delete nodeclaims.karpenter.sh --all --ignore-not-found=true --timeout=300s \
            --wait=true || true

          # Anything still stuck shouldn't block Terraform from removing the
          # NodePool/EC2NodeClass objects next.
          for resource in ec2nodeclasses.karpenter.k8s.aws nodepools.karpenter.sh nodeclaims.karpenter.sh; do
            kubectl get "$resource" -o name 2>/dev/null | while read -r item; do
              [[ -n "$item" ]] || continue
              kubectl patch "$item" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done

      - name: Safety net - terminate orphaned Karpenter EC2 instances
        shell: bash
        continue-on-error: true
        run: |
          instance_ids=$(aws ec2 describe-instances \
            --filters "Name=tag:karpenter.sh/cluster,Values=${{ inputs.cluster_name }}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text --region "${{ env.AWS_REGION }}")

          if [[ -n "$instance_ids" ]]; then
            echo "Terminating orphaned Karpenter-managed instances: $instance_ids"
            aws ec2 terminate-instances --instance-ids $instance_ids --region "${{ env.AWS_REGION }}" || true
            aws ec2 wait instance-terminated --instance-ids $instance_ids --region "${{ env.AWS_REGION }}" || true
          else
            echo "No leftover Karpenter-managed EC2 instances found."
          fi

      - name: Delete leftover PersistentVolumeClaims
        shell: bash
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not connected to a live cluster. Skipping PVC cleanup."
            exit 0
          fi

          # Delete PVCs while the EBS CSI driver is still running so it can clean up the
          # backing EBS volumes, instead of leaving them orphaned after cluster teardown.
          kubectl delete pvc --all --all-namespaces --ignore-not-found=true --timeout=180s \
            --wait=true || true

      - name: Terraform plan
        shell: bash
        run: |
          tf_plan_args=(
            -target=kubernetes_manifest.karpenter_node_class
            -target=kubernetes_manifest.karpenter_node_pool
          )

          terraform plan -destroy -lock-timeout=10m -no-color "${tf_plan_args[@]}" -out=tfplan

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

  remove_addons:
    needs: remove_addon_live_manifests
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set staged destroy variables for addons
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_observability=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_argocd=false" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: terraform plan -lock-timeout=10m -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

  destroy_base:
    needs: remove_addons
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set base destroy variables
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_observability=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_argocd=false" >> "$GITHUB_ENV"

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan destroy
        run: terraform plan -destroy -lock-timeout=10m -no-color -out=tfdestroy

      - name: Terraform destroy
        run: terraform apply -lock-timeout=10m -auto-approve tfdestroy

      - name: Residual cleanup guidance on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "### Manual cleanup follow-up"
            echo
            echo "Terraform destroy did not fully complete. If AWS still has dependent resources, clean them up in this order before rerunning the workflow:"
            echo
            echo "- terminate and delete any leftover EC2 instances"
            echo "- delete leftover network interfaces"
            echo "- delete subnets"
            echo "- detach and delete internet gateways"
            echo "- delete security groups that are no longer in use"
            echo "- check for and delete any leftover EBS volumes tagged for this cluster"
            echo "- remove any other dependent resources still blocking VPC deletion"
            echo
            echo "After that cleanup, rerun the manual destroy workflow for cluster ${{ inputs.cluster_name }}."
          } >> "$GITHUB_STEP_SUMMARY"
