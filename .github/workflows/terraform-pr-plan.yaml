name: Terraform PR Plan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "**/*.tf"
      - ".terraform.lock.hcl"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'els-k8s-infra/terraform.tfstate' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-west-1' }}
  TF_VAR_cluster_name: ${{ vars.TF_VAR_cluster_name || 'els-cluster' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    needs: validate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TF_VAR_argocd_github_app_id: ${{ vars.ARGOCD_GITHUB_APP_ID }}
      TF_VAR_argocd_github_app_installation_id: ${{ vars.ARGOCD_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_argocd_github_app_private_key: ${{ secrets.ARGOCD_GITHUB_APP_PRIVATE_KEY }}
    concurrency:
      group: terraform-state-lock
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage:
          - base
          - addons

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set stage variables
        shell: bash
        run: |
          echo "TF_VAR_enable_cluster_addons=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_ingress_nginx=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_karpenter=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_observability=false" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_argocd=false" >> "$GITHUB_ENV"
          echo "INCLUDE_LIVE_CLUSTER_MANIFESTS=false" >> "$GITHUB_ENV"

          if [[ "${{ matrix.stage }}" == "addons" ]]; then
            echo "TF_VAR_enable_cluster_addons=true" >> "$GITHUB_ENV"
            echo "TF_VAR_enable_ingress_nginx=true" >> "$GITHUB_ENV"
            echo "TF_VAR_enable_karpenter=true" >> "$GITHUB_ENV"
            echo "TF_VAR_enable_observability=true" >> "$GITHUB_ENV"
            echo "TF_VAR_enable_argocd=true" >> "$GITHUB_ENV"

          fi

      - name: Write backend override
        shell: bash
        run: |
          cat <<'EOF' > backend_override.tf
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Detect live cluster manifest planning state
        if: ${{ matrix.stage == 'addons' }}
        shell: bash
        run: |
          if terraform state list | grep -q '^module\.eks\.aws_eks_cluster\.this\[0\]$'; then
            echo "INCLUDE_LIVE_CLUSTER_MANIFESTS=true" >> "$GITHUB_ENV"
            echo "Addon live-cluster manifests are included for this PR plan because the EKS cluster already exists in Terraform state." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "INCLUDE_LIVE_CLUSTER_MANIFESTS=false" >> "$GITHUB_ENV"
            echo "Addon live-cluster manifests are excluded from this PR plan because the EKS cluster is not yet in Terraform state. The main apply workflow will create the cluster first and then apply these manifests in the same addon stage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build stage target list
        shell: bash
        run: |
          rm -f plan-targets.txt

          case "${{ matrix.stage }}" in
            base)
              cat > plan-targets.txt <<'EOF'
          -target=module.vpc
          -target=module.eks
          -target=aws_eks_node_group.addons
          -target=aws_iam_role.addons_node_group
          -target=aws_iam_role_policy_attachment.addons_node_group_worker
          -target=aws_iam_role_policy_attachment.addons_node_group_ecr
          -target=aws_iam_role_policy_attachment.addons_node_group_cni
          -target=aws_launch_template.addons_node_group
          -target=aws_iam_role_policy_attachment.ebs_csi_driver_custom_policy
          -target=aws_eks_addon.vpc_cni
          -target=aws_eks_addon.kube_proxy
          -target=aws_eks_addon.eks_pod_identity_agent
          -target=aws_eks_addon.coredns
          -target=aws_eks_addon.aws_ebs_csi_driver
          -target=aws_sqs_queue.karpenter_interruption_queue
          -target=aws_sqs_queue_policy.karpenter_interruption_queue
          -target=aws_cloudwatch_event_rule.karpenter_instance_state_change
          -target=aws_cloudwatch_event_rule.karpenter_spot_interruption
          -target=aws_cloudwatch_event_rule.karpenter_rebalance
          -target=aws_cloudwatch_event_rule.karpenter_scheduled_change
          -target=aws_cloudwatch_event_target.karpenter_instance_state_change
          -target=aws_cloudwatch_event_target.karpenter_spot_interruption
          -target=aws_cloudwatch_event_target.karpenter_rebalance
          -target=aws_cloudwatch_event_target.karpenter_scheduled_change
          -target=aws_iam_role.karpenter_controller
          -target=aws_iam_policy.karpenter_controller
          -target=aws_iam_role_policy_attachment.karpenter_controller
          -target=aws_iam_role.karpenter_node
          -target=aws_iam_instance_profile.karpenter_instance_profile
          -target=aws_iam_role_policy_attachment.karpenter_node_worker
          -target=aws_iam_role_policy_attachment.karpenter_node_cni
          -target=aws_iam_role_policy_attachment.karpenter_node_ecr
          -target=aws_iam_role_policy_attachment.karpenter_node_ssm
          -target=aws_eks_access_entry.cluster_admin
          -target=aws_eks_access_policy_association.cluster_admin
          EOF
              ;;
            addons)
              cat > plan-targets.txt <<'EOF'
          -target=helm_release.ingress_nginx
          -target=kubernetes_namespace_v1.karpenter
          -target=helm_release.karpenter_crd
          -target=helm_release.karpenter
          -target=kubernetes_namespace_v1.observability
          -target=helm_release.loki
          -target=helm_release.promtail
          -target=helm_release.kube_prometheus_stack
          -target=kubernetes_namespace_v1.argocd
          -target=helm_release.argocd
          -target=kubernetes_secret_v1.argocd_github_repo_creds
          EOF

              if [[ "${INCLUDE_LIVE_CLUSTER_MANIFESTS}" == "true" ]]; then
                cat >> plan-targets.txt <<'EOF'
          -target=kubectl_manifest.karpenter_node_class
          -target=kubectl_manifest.karpenter_node_pool
          -target=kubectl_manifest.argocd_root_app
          EOF
              fi
              ;;
          esac

          if [[ -f plan-targets.txt ]]; then
            sed -i 's/^[[:space:]]*//' plan-targets.txt
            sed -i '/^$/d' plan-targets.txt
          fi

          echo "Stage-targeted PR plan configured for ${{ matrix.stage }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform plan
        shell: bash
        run: |
          mapfile -t tf_plan_args < plan-targets.txt
          terraform plan -lock-timeout=10m -no-color "${tf_plan_args[@]}" -out=tfplan

      - name: Render plan text
        shell: bash
        run: terraform show -no-color tfplan > plan.txt

      - name: Build PR comment
        shell: bash
        run: |
          marker="<!-- terraform-plan:${{ matrix.stage }} -->"
          commit_sha="${{ github.event.pull_request.head.sha }}"
          max_chars=60000
          plan_chars=$(wc -c < plan.txt)
          plan_summary=$(grep -E '^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.$' plan.txt | tail -n 1 || true)

          if [[ -z "$plan_summary" ]]; then
            if grep -q '^Stage skipped:' plan.txt; then
              plan_summary=$(head -n 1 plan.txt)
            elif grep -q 'No changes.' plan.txt; then
              plan_summary="No changes."
            else
              plan_summary="Plan summary not found in output."
            fi
          fi

          if [[ "$plan_chars" -gt "$max_chars" ]]; then
            head -c "$max_chars" plan.txt > plan-comment.txt
            truncation_note="\n\nPlan output truncated for PR comment. Download the workflow artifact for the full text."
          else
            cp plan.txt plan-comment.txt
            truncation_note=""
          fi

          {
            echo "$marker"
            echo "## Terraform plan: ${{ matrix.stage }}"
            echo
            printf 'Commit: `%s`\n\n' "$commit_sha"
            printf '**Summary:** %s\n\n' "$plan_summary"
            echo "This is a stage-targeted plan. Resources outside this stage are intentionally omitted to avoid misleading destroy noise."
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```terraform'
            cat plan-comment.txt
            echo '```'
            printf '%b\n' "$truncation_note"
            echo
            echo "</details>"
          } > pr-comment.md

          {
            echo "### Terraform plan: ${{ matrix.stage }}"
            echo
            printf 'Summary: %s\n\n' "$plan_summary"
            echo "Plan artifact uploaded for this stage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-pr-${{ matrix.stage }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tfplan
            plan.txt

      - name: Publish PR comment
        uses: actions/github-script@v9
        env:
          COMMENT_FILE: pr-comment.md
          MARKER: <!-- terraform-plan:${{ matrix.stage }} -->
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            const marker = process.env.MARKER;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user.type === 'Bot' && comment.body.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
